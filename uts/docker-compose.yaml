services:

#---------------------------- "REST Services" -----------------------------------
  product-api:
    build: .
    command: node ./RESTful-API/server.js
    ports:
      - "3000:3000"
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8086:8080"
    environment:
      SWAGGER_JSON: /api/openapi.yaml
    volumes:
      - ./openapi/openapi.yaml:/api/openapi.yaml
  # open-api:
  #   image: swaggerapi/swagger-ui
  #   ports:
  #     - "8010:8010"
  #   environment:
  #     SWAGGER_JSON: /api/openapi.yaml
  #   volumes:
  #     - ./openapi/openapi.yaml:/api/openapi.yaml
#---------------------------- "REST Services" -----------------------------------
  data-serlization:
    build: .
    command: node ./data_serilization/data-s.js
    ports:
      - "3006:3006"
    restart: unless-stopped

#---------------------------- "JSON-RPC Services" -----------------------------------
  python-s:
    build: ./json-rpc/server
    container_name: python_rpc_server
    ports:
      - "5000:5000"
    volumes:
      - ./json-rpc/server:/app

  python-c-task:
    build: ./json-rpc/client/python-c
    container_name: python_rpc_client-task
    ports:
      - "50000:50000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./json-rpc/client/python-c:/app

  node-client-task:
    build: ./json-rpc/client/node
    container_name: node_rpc_client-task
    ports:
      - "3001:3001"
    volumes:
      - ./json-rpc/client/node:/app
    depends_on:
      - python-s

  php-client-task:
    build: ./json-rpc/client/php
    container_name: php_rpc_client-task
    ports:
      - "8081:8081"
    volumes:
      - ./json-rpc/client/php:/app
    depends_on:
      - python-s
#---------------------------- "JSON-RPC Services" -----------------------------------